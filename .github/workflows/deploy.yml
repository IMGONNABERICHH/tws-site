name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # lets the daily news job deploy itself — a push made with GITHUB_TOKEN
  # does not fire the push event above
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8685957a82fa94a4d6d766f0b35acc3a
    steps:
      - uses: actions/checkout@v4
        with:
          # build the branch tip, not github.sha — when the daily news job calls
          # this workflow, github.sha still points at the commit from before the
          # brief was committed, so the site would deploy without it
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
      - name: Refuse to deploy a build that lost published work
        run: node scripts/verify-brief.js --built
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name=tws-site --branch=main --commit-dirty=true
      - name: Missing token notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set. Build succeeded but the deploy to Cloudflare Pages was skipped."
