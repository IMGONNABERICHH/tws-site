name: The Wire — daily brief

on:
  schedule:
    # 07:00 America/Los_Angeles. GitHub cron is UTC and does not follow DST,
    # so both offsets are listed; the job exits early on the wrong one.
    - cron: "0 14 * * *"   # 07:00 PDT (Mar–Nov)
    - cron: "0 15 * * *"   # 07:00 PST (Nov–Mar)
    # second and third chances: these do nothing if the morning run published
    - cron: "0 16 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: the-wire
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.commit.outputs.published }}
    permissions:
      contents: write
    steps:
      # Several crons fire each morning: two to cover both DST offsets, then
      # later ones as retries. Rather than pick the "right" one by clock, each
      # asks the same question — has today's brief been published yet?
      - uses: actions/checkout@v4

      - name: Has today's brief published already?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — going ahead."
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          hour=$(TZ=America/Los_Angeles date +%H)
          if [ "$hour" -lt 7 ]; then
            echo "It is ${hour}:00 in Los Angeles — too early, this is the other DST cron."
            echo "run=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          today=$(TZ=America/Los_Angeles date '+%B %-d, %Y')
          published=$(sed -n 's/.*"dateline": "\(.*\)".*/\1/p' content/news/latest.json 2>/dev/null | head -1)
          if [ "$published" = "$today" ]; then
            echo "Today's brief ($today) is already published — nothing to do."
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "Latest brief is '$published', today is '$today' — writing it."
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm install --no-audit --no-fund

      - name: Gather the day's headlines
        if: steps.gate.outputs.run == 'true'
        env:
          # optional — without it the brief uses each outlet's own summary line
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-news.js

      - name: Commit the brief
        id: commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "TWS Wire"
          git config user.email "noreply@7langes.la"
          git add content/news/latest.json
          if git diff --staged --quiet; then
            echo "No change in today's brief — nothing to publish."
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "The Wire: $(TZ=America/Los_Angeles date '+%B %-d, %Y')"
          # main may have moved while the brief was being written — a story
          # published through the admin, or another job. Rebase and retry
          # rather than losing the morning's work to a stale checkout.
          for attempt in 1 2 3; do
            if git push; then
              echo "published=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git pull --rebase origin main || exit 1
            sleep 3
          done
          echo "::error::Could not push today's brief after 3 attempts."
          exit 1

  deploy:
    needs: brief
    if: needs.brief.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
